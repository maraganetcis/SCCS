<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCCS - 신촌중학교 채팅서비스</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=5" />
    <style>
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <section id="authGate" class="gate">
      <div class="gate-card">
        <div class="auth-header" style="display:flex; flex-direction:column; align-items:center; gap:12px; margin-bottom: 8px;">
          <svg class="sccs-logo" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
          </svg>
          <h1>SCCS 시작하기</h1>
        </div>
        <p>로그인 후 나만의 아이디를 만들고 친구와 채팅하세요.</p>
        <button id="googleBtn" class="google">
          <svg width="18" height="18" viewBox="0 0 48 48" style="margin-right:8px;">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Google로 계속하기
        </button>
        <div id="authNotice" class="gate-notice" aria-live="polite"></div>
      </div>
    </section>

    <section id="usernameGate" class="gate hidden" hidden>
      <div class="gate-card">
        <div style="display:flex; flex-direction:column; align-items:center; gap:12px; margin-bottom: 8px;">
          <svg class="sccs-logo" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
          </svg>
          <h1>아이디 설정</h1>
        </div>
        <p>처음 1회만 설정합니다. 중복된 아이디는 사용할 수 없습니다.</p>
        <input id="onboardUsername" type="text" placeholder="아이디 (예: synox_minji)" />
        <input id="onboardDisplayName" type="text" placeholder="이름 / 표시명" />
        <button id="completeOnboardingBtn">채팅 시작하기</button>
        <div id="onboardNotice" class="gate-notice" aria-live="polite"></div>
      </div>
    </section>

    <div class="app-shell hidden" id="appShell" hidden>
      <aside class="left-panel glass">
        <div class="brand" style="display:flex; align-items:center; gap:8px;">
          <svg class="sccs-logo" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
          </svg>
          SCCS
        </div>
        <div class="user-card">
          <div class="avatar" id="myAvatar">🙂</div>
          <div>
            <h2 id="myDisplayName">-</h2>
            <p id="myTag">@-</p>
          </div>
        </div>

        <div class="section-title">친구</div>
        <div class="friend-list" id="friendList"></div>
      </aside>

      <main class="chat-panel glass">
        <header class="chat-header">
          <div>
            <h1 id="chatTitle">채팅을 선택하세요</h1>
            <p id="chatSubtitle">친구를 추가하고 대화를 시작하세요.</p>
          </div>
          <button id="openMyPage" class="ghost">마이페이지</button>
        </header>

        <section class="message-area" id="messageArea"></section>

        <footer class="message-input-wrap">
          <input id="messageInput" type="text" placeholder="메시지를 입력하세요..." />
          <button id="sendBtn">전송</button>
        </footer>
      </main>

      <aside class="right-panel glass">
        <div class="tabs">
          <button id="searchTabBtn" class="tab-btn active">사용자 검색</button>
          <button id="quickAddTabBtn" class="tab-btn">아이디 추가</button>
        </div>

        <section id="searchTab" class="tab-content">
          <h3>사용자 검색</h3>
          <p class="muted">아이디 또는 이름으로 검색해서 친구 추가하세요.</p>
          <div class="row">
            <input id="searchUserInput" type="text" placeholder="아이디 또는 이름" />
            <button id="searchUserBtn">검색</button>
          </div>
          <div id="userSearchResults" class="result-list"></div>

          <h3>선택 사용자 친구 목록</h3>
          <div id="publicFriendList" class="result-list muted">사용자를 선택하면 표시됩니다.</div>
        </section>

        <section id="quickAddTab" class="tab-content hidden" hidden>
          <h3>친구 추가 (아이디)</h3>
          <div class="row">
            <input id="friendUsernameInput" type="text" placeholder="친구 아이디 입력" />
            <button id="addFriendBtn">추가</button>
          </div>
        </section>

        <section>
          <h3>알림</h3>
          <div id="toast" class="toast">준비 완료</div>
        </section>
      </aside>
    </div>

    <footer class="copyright">© by SCT Synox Studios</footer>

    <dialog id="myPageDialog">
      <form method="dialog" class="profile-form">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
          <svg class="sccs-logo" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
          </svg>
          <h2>마이페이지</h2>
        </div>
        <label>
          이름 추가 / 편집
          <input type="text" id="mpDisplayName" placeholder="표시 이름" />
        </label>
        <label>
          아이디 편집
          <input type="text" id="mpUsername" placeholder="아이디" />
        </label>
        <button id="saveIdentityBtn">이름/아이디 저장</button>

        <label>
          상태 메시지
          <input type="text" id="mpBio" placeholder="오늘도 즐거운 채팅!" />
        </label>
        <label>
          아바타 이모지
          <input type="text" maxlength="2" id="mpAvatar" placeholder="😎" />
        </label>
        <label>
          테마 색상
          <input type="color" id="mpTheme" value="#6e61ff" />
        </label>
        <button id="saveProfileBtn" class="ghost">프로필 편집 저장</button>

        <menu>
          <button value="cancel" class="ghost">닫기</button>
          <button id="logoutBtn" class="danger">로그아웃</button>
        </menu>
      </form>
    </dialog>

    <script type="module" src="app.js?v=5"></script>
  </body>
</html>
